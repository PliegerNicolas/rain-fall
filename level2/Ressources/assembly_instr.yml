instructions:
    mov : move data from on location to another
      - dest : to
      - source: from
    lea : store the adress on the destination, assign adress
      - dest:
      - value: address
    jmp : CPU jum to a new location by changing the instruction pointer
      - dest :
    add / sub : arithmetic adding
      - dest : "dest = dest +/- value"
      - value: value to add
    inc : in/de/crement dest by 1
      - syntax: inc [dest]
    push: put a value on the stack
      example: push eax
    pop : remove value from the stack
    call: call a function [call nameFunc]
    cmp : je, jne,
    AND/XOR : value, value

    
    DWORD PTR : [4 byte] Pointer
    BYTE PTR  : [1 byte] 
    WORD PTR  : [2 BYTES]

 
    fixed rules I can follow ! 
    [ebp - offset] : us the ebp to acces variables
    [ebp + 12]  arg2
    [ebp + 8 ]  arg1
    [ebp + 4 ]  return address   ← always 4 bytes
    [ebp + 0 ]  saved EBP
    [ebp - x ]  local variables

